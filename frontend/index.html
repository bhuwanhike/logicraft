<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7fb" />
    <meta name="description" content="LogiCraft fleet, shipment, and warehouse operations dashboard." />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#f5f7fb" />
    <title>LogiCraft | Operations</title>
    <!--
      Applies the stored theme before first paint. Without this the page renders
      light and then snaps to dark once React mounts, which is a visible flash on
      every reload. Keep the key and the .dark-mode class in step with
      src/hooks/useTheme.js.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('logicraft.theme');
          var dark = saved === 'dark' ||
            (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.classList.add('dark-mode');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {
          /* storage unavailable: fall through to the light default */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <!--
      Runtime configuration. A classic script, so it runs before the deferred
      module bundle below and window.__LOGICRAFT_CONFIG__ is populated by the
      time src/config.ts reads it. Copied verbatim into dist/ by Vite, so it can
      be edited on the server without rebuilding. See public/config.js.
    -->
    <script src="/config.js"></script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
