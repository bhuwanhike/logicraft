# Every deployment-specific value is read from the environment. Defaults exist
# only for local development, and none of them are secrets: a value that must
# not be guessable (DB_PASSWORD, JWT_SECRET) has no default at all, so a
# deployment that forgets to set it fails at startup instead of running insecure.
#
# Local development: copy .env.example to .env and `mvn spring-boot:run` picks
# it up via the spring.config.import below. .env is git-ignored.
# Deployment: set the variables in the platform's dashboard. Real environment
# variables take precedence over the imported .env, so the same build works in
# both places.

spring:
  application:
    name: logicraft-api

  # Lets a local .env file supply values without a shell wrapper. `[.properties]`
  # is the file extension hint: KEY=VALUE lines are already valid properties.
  # "optional" because in production there is no .env file, only real variables.
  config:
    import: "optional:file:.env[.properties]"

  datasource:
    # DB_URL overrides the whole thing; otherwise it is composed from the parts.
    # Managed Postgres providers hand out a full jdbc: URL, self-hosted does not,
    # and both should work without editing this file.
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:logicraft}${DB_URL_PARAMS:}}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # A pool sized for a single instance. Raise it on a larger plan; a pool
      # larger than the database's own connection limit just moves the failure.
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:10000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:300000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1200000}

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only checks that the entities agree
      # with what the migrations produced.
      ddl-auto: validate
    # Off by default: it logs every statement with bound values, which is noise
    # in production and writes row contents into the log aggregator.
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:false}

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration
    # Re-running the seed migrations against a populated database would
    # duplicate 50k shipments, so a checksum change fails the deploy instead.
    validate-on-migrate: true

server:
  port: ${PORT:8080}
  address: ${SERVER_ADDRESS:0.0.0.0}
  servlet:
    # The frontend's VITE_API_BASE already ends in /api/v1, so this and that must
    # agree. Change API_CONTEXT_PATH and VITE_API_BASE together.
    context-path: ${API_CONTEXT_PATH:/api/v1}
  # Behind a reverse proxy or platform router the request arrives as http with an
  # X-Forwarded-Proto header. Without this, redirects and CORS decisions are made
  # against the wrong scheme.
  forward-headers-strategy: framework
  error:
    # Stack traces and exception messages in a response body leak internals.
    # The controllers already return a sanitised {error} body; this stops Spring
    # from adding its own on top for anything that escapes them.
    include-stacktrace: never
    include-message: never
  shutdown: graceful

# CORS origins for the dashboard. The list is the browser-side security
# boundary, so it is explicit rather than a pattern.
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

jwt:
  # No default. JwtTokenProvider requires this to be at least 32 bytes for
  # HS256; a missing or short value stops the application from starting.
  # Generate one with: openssl rand -hex 32
  secret: ${JWT_SECRET}
  # 24 hours, in milliseconds.
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.logicraft: ${LOG_LEVEL_APP:INFO}
    # Set to DEBUG to see the SQL the controllers send, which is what the test
    # suite asserts on.
    org.springframework.jdbc.core.JdbcTemplate: ${LOG_LEVEL_JDBC:INFO}
